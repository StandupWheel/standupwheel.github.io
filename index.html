<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Standup Wheel</title>
    <style>
:root {
  --bg: #0f1218;
  --surface: #171c26;
  --border: #2a3344;
  --text: #e8ecf4;
  --muted: #8b95a8;
  --accent: #5b8def;
  --accent-hover: #7aa3f5;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.layout {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.app-split {
  flex: 1;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  min-height: 0;
}

.wheel-panel {
  flex: 1 1 65%;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
}

.links-panel {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--border);
  width: 3.5rem;
  transition: width 0.2s ease;
  overflow: hidden;
}

.links-panel.links-panel--expanded {
  width: clamp(220px, 26vw, 320px);
}

.links-toggle-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 2.5rem;
  height: 2.5rem;
  margin: 0.5rem;
  padding: 0;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  font-size: 1.2rem;
  flex: 0 0 auto;
}

.links-toggle-btn:hover {
  border-color: var(--muted);
}

.links-content {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  padding: 0 0.75rem 0.75rem;
  min-width: clamp(220px, 26vw, 320px);
  flex: 1;
  min-height: 0;
  opacity: 0;
  transition: opacity 0.15s ease;
  pointer-events: none;
}

.links-panel--expanded .links-content {
  opacity: 1;
  pointer-events: auto;
}

.links-title {
  margin: 0;
  font-size: 0.95rem;
  color: var(--text);
}

.links-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}

.links-empty {
  color: var(--muted);
  font-size: 0.85rem;
  padding: 0.4rem 0;
}

.link-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.4rem;
  padding: 0.4rem 0.5rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
}

.link-item--editing {
  flex-direction: column;
  align-items: stretch;
}

.link-item__link {
  color: var(--accent);
  text-decoration: none;
  font-size: 0.85rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  min-width: 0;
}

.link-item__link:hover {
  text-decoration: underline;
}

.link-item__actions {
  display: flex;
  gap: 0.25rem;
  flex: 0 0 auto;
}

.link-item__icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 1.75rem;
  height: 1.75rem;
  padding: 0;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  font-size: 0.85rem;
}

.link-item__icon-btn:hover {
  border-color: var(--muted);
}

.link-item__input {
  padding: 0.35rem 0.5rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 0.85rem;
  font-family: inherit;
}

.links-add-form {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  padding-top: 0.4rem;
  border-top: 1px solid var(--border);
}

.links-add-form input {
  padding: 0.4rem 0.5rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 0.85rem;
  font-family: inherit;
}

.links-add-form input:focus {
  outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
  outline-offset: 1px;
}

.config-side {
  flex: 0 0 clamp(200px, 24vw, 280px);
  width: clamp(200px, 24vw, 280px);
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 0.85rem 1rem 1rem;
  background: var(--surface);
  overflow: hidden;
}

.config-panel {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  flex: 1;
  min-height: 0;
  width: 100%;
}

.names-actions {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.25rem;
}

.names-actions .btn {
  flex: 1;
  min-width: 0;
}

.config-label {
  font-size: 0.8rem;
  color: var(--muted);
}

#namesInput {
  width: 100%;
  flex: 1 1 auto;
  resize: none;
  min-height: 6rem;
  padding: 0.55rem 0.6rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 0.9rem;
  line-height: 1.35;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

#namesInput:focus {
  outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
  outline-offset: 1px;
}

.btn {
  padding: 0.5rem 0.9rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 0.9rem;
  cursor: pointer;
}

.btn:hover:not(:disabled) {
  border-color: var(--muted);
}

.btn.primary {
  background: var(--accent);
  border-color: transparent;
  color: #0b1020;
  font-weight: 600;
}

.btn.primary:hover:not(:disabled) {
  background: var(--accent-hover);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.wheel-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1rem 0.5rem 1.25rem;
  gap: 1rem;
  min-height: 0;
}

.wheel-wrap {
  position: relative;
  width: min(100%, min(92vmin, 820px));
  max-width: 100%;
  aspect-ratio: 1;
  cursor: default;
}

.wheel-wrap.wheel-wrap--can-spin {
  cursor: pointer;
}

#wheelCanvas {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 50%;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
}

.pointer {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-top: 22px solid #34a853;
  filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
  z-index: 2;
}

@media (max-width: 720px) {
  .app-split {
    flex-direction: column;
  }

  .wheel-panel {
    flex: 1 1 auto;
    border-right: none;
    border-bottom: 1px solid var(--border);
    min-height: min(62vh, 520px);
  }

  .config-side {
    flex: 0 0 auto;
    width: 100%;
    max-height: 42vh;
    border-left: none;
    margin-left: 0;
    border-top: 1px solid var(--border);
  }

  .wheel-wrap {
    width: min(92vw, min(82vmin, 640px));
  }

  #namesInput {
    resize: vertical;
    max-height: 28vh;
  }

  .links-panel.links-panel--expanded {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: min(80vw, 320px);
    z-index: 10;
    box-shadow: 8px 0 24px rgba(0, 0, 0, 0.5);
  }
}

.result-dialog {
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
  max-width: min(94vw, 520px);
  width: min(94vw, 520px);
}

.result-dialog::backdrop {
  background: rgba(5, 8, 12, 0.72);
  backdrop-filter: blur(2px);
}

.result-dialog__form {
  display: flex;
  flex-direction: column;
  gap: 1.35rem;
  padding: 1.85rem 2rem 2rem;
  margin: 0;
}

.result-dialog__label {
  margin: 0;
  font-size: 1rem;
  color: var(--muted);
  text-align: center;
}

.result-dialog__name {
  margin: 0;
  font-size: clamp(1.75rem, 5vw, 2.75rem);
  font-weight: 700;
  text-align: center;
  line-height: 1.2;
  word-break: break-word;
}

.result-dialog__actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 0.6rem;
  margin-top: 0.25rem;
  width: 100%;
}

.result-dialog__actions .btn {
  min-width: 7rem;
  padding: 0.55rem 1.1rem;
  font-size: 1rem;
}

.configure-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 2.5rem;
  height: 2.5rem;
  flex: 0 0 auto;
  padding: 0;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  cursor: pointer;
  font-size: 1.2rem;
  transition: all 0.2s ease;
}

.configure-btn:hover {
  border-color: var(--muted);
  background: var(--surface);
}

.configure-btn:active {
  background: var(--accent);
  border-color: var(--accent);
  color: #0b1020;
}

.config-dialog {
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
  max-width: min(94vw, 400px);
  width: min(94vw, 400px);
}

.config-dialog::backdrop {
  background: rgba(5, 8, 12, 0.72);
  backdrop-filter: blur(2px);
}

.config-dialog__form {
  display: flex;
  flex-direction: column;
  gap: 1.35rem;
  padding: 1.85rem 2rem 2rem;
  margin: 0;
}

.config-dialog__title {
  margin: 0;
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text);
}

.config-dialog__group {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.config-dialog__label {
  font-size: 0.9rem;
  color: var(--muted);
}

.config-dialog__input {
  padding: 0.6rem 0.75rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 0.95rem;
  font-family: inherit;
}

.config-dialog__input:focus {
  outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
  outline-offset: 1px;
  border-color: var(--accent);
}

.config-dialog__actions {
  display: flex;
  gap: 0.75rem;
  justify-content: flex-end;
  margin-top: 0.5rem;
}

.config-dialog__actions .btn {
  min-width: 6.5rem;
  padding: 0.55rem 1rem;
  font-size: 0.95rem;
}

</style>
  </head>
  <body>
    <div class="layout">
      <div class="app-split">
        <aside class="links-panel" id="linksPanel">
          <button type="button" id="linksToggleBtn" class="links-toggle-btn" aria-expanded="false" aria-controls="linksContent" title="Toggle links">🔗</button>
          <div class="links-content" id="linksContent">
            <h2 class="links-title">Links</h2>
            <ul class="links-list" id="linksList"></ul>
            <form class="links-add-form" id="linksAddForm">
              <input type="text" id="linkTitleInput" placeholder="Title" autocomplete="off" />
              <input type="text" id="linkUrlInput" placeholder="https://example.com" autocomplete="off" />
              <button type="submit" class="btn primary">Add link</button>
            </form>
          </div>
        </aside>
        <main class="wheel-panel">
          <div class="wheel-area">
            <div class="wheel-wrap">
              <canvas
                id="wheelCanvas"
                width="720"
                height="720"
                aria-label="Standup Wheel. Click to spin."
              ></canvas>
              <div class="pointer" aria-hidden="true"></div>
            </div>
          </div>
        </main>
        <aside class="config-side">
          <div class="config-panel">
            <label class="config-label" for="namesInput">Names (one per line)</label>
            <textarea id="namesInput" rows="10" spellcheck="false"></textarea>
            <div class="names-actions">
              <button type="button" id="refreshBtn" class="btn">Refresh</button>
              <button type="button" id="saveBtn" class="btn primary">Save</button>
              <button type="button" id="configureBtn" class="configure-btn" aria-label="Configure spin duration" title="Configure">⚙️</button>
            </div>
          </div>
        </aside>
      </div>
    </div>
    <dialog id="resultDialog" class="result-dialog" aria-labelledby="resultDialogLabel">
      <form method="dialog" class="result-dialog__form">
        <p id="resultDialogLabel" class="result-dialog__label">The wheel selected</p>
        <p id="resultDialogName" class="result-dialog__name" aria-live="polite"></p>
        <div class="result-dialog__actions">
          <button type="submit" class="btn primary" value="spin">Spin</button>
          <button type="submit" class="btn" value="close">Close</button>
        </div>
      </form>
    </dialog>
    <dialog id="configDialog" class="config-dialog" aria-labelledby="configDialogTitle">
      <form method="dialog" class="config-dialog__form">
        <h2 id="configDialogTitle" class="config-dialog__title">Configure Spin Duration</h2>
        <div class="config-dialog__group">
          <label class="config-dialog__label" for="spinDurationInput">Spin Duration (seconds)</label>
          <input type="number" id="spinDurationInput" class="config-dialog__input" min="1" max="10" step="0.1" />
        </div>
        <div class="config-dialog__actions">
          <button type="button" class="btn" id="configCancelBtn">Cancel</button>
          <button type="button" class="btn primary" id="configSaveBtn">Save</button>
        </div>
      </form>
    </dialog>
    <script>
globalThis.__WHEEL_DEFAULT__ = {"spinDurationSeconds":3,"spinSpeed":2,"names":["James","Sophia","Michael","Emma","David"]};
const NAMES_CACHE_KEY = "wheel.namesCache.v1";
/** Removed UI spin cache; strip if still present. */
const LEGACY_SPIN_DURATION_CACHE_KEY = "wheel.spinDurationSec.v1";
const LINKS_CACHE_KEY = "wheel.linksCache.v1";

const canvas = document.getElementById("wheelCanvas");
const wheelWrap = document.querySelector(".wheel-wrap");
const ctx = canvas.getContext("2d");
const namesInput = document.getElementById("namesInput");
const refreshBtn = document.getElementById("refreshBtn");
const saveBtn = document.getElementById("saveBtn");
const resultDialog = document.getElementById("resultDialog");
const resultDialogName = document.getElementById("resultDialogName");
const configureBtn = document.getElementById("configureBtn");
const configDialog = document.getElementById("configDialog");
const spinDurationInput = document.getElementById("spinDurationInput");
const configCancelBtn = document.getElementById("configCancelBtn");
const configSaveBtn = document.getElementById("configSaveBtn");
const linksPanel = document.getElementById("linksPanel");
const linksToggleBtn = document.getElementById("linksToggleBtn");
const linksList = document.getElementById("linksList");
const linksAddForm = document.getElementById("linksAddForm");
const linkTitleInput = document.getElementById("linkTitleInput");
const linkUrlInput = document.getElementById("linkUrlInput");

let spinDurationMs = 3000;
/** Minimum full 360° rotations during a spin; higher = faster rotation for the same duration. */
let spinMinFullTurns = 5;
let rotationRad = 0;
let spinning = false;
/** @type {{ winIdx: number, winner: string } | null} */
let pendingSpinResult = null;
let names = [];

/** Four wheel colors; neighbors on the ring never reuse the same fill (any segment count). */
const WHEEL_COLOR_FILLS = ["#4285F4", "#EA4335", "#34A853", "#FBBC05"];
const WHEEL_COLOR_TEXTS = ["#ffffff", "#ffffff", "#0f1218", "#0f1218"];

/** @returns {number[]} color indices length `n`, adjacent slices (incl. wrap) always differ. */
function wheelColorIndicesNoAdjacentSame(n) {
  const k = WHEEL_COLOR_FILLS.length;
  if (n <= 0) return [];
  if (n === 1) return [0];
  const out = new Array(n);
  out[0] = 0;
  for (let i = 1; i < n - 1; i++) {
    out[i] = (out[i - 1] + 1) % k;
  }
  let chosen = -1;
  for (let c = 0; c < k; c++) {
    if (c !== out[n - 2] && c !== out[0]) {
      chosen = c;
      break;
    }
  }
  out[n - 1] = chosen >= 0 ? chosen : (out[n - 2] + 1) % k;
  return out;
}

function parseNamesFromTextarea() {
  return namesInput.value
    .split(/\r?\n/)
    .map((s) => s.trim())
    .filter(Boolean);
}

/** @returns {string[] | null} non-empty list, or null if none cached */
function readNamesFromCache() {
  try {
    const raw = localStorage.getItem(NAMES_CACHE_KEY);
    if (raw == null || raw === "") return null;
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return null;
    const list = parsed.map(String).map((s) => s.trim()).filter(Boolean);
    return list.length > 0 ? list : null;
  } catch {
    return null;
  }
}

function writeNamesToCache(list) {
  const normalized = list.map((s) => String(s).trim()).filter(Boolean);
  if (normalized.length === 0) {
    localStorage.removeItem(NAMES_CACHE_KEY);
    localStorage.removeItem(LEGACY_SPIN_DURATION_CACHE_KEY);
  } else {
    localStorage.setItem(NAMES_CACHE_KEY, JSON.stringify(normalized));
  }
}

function clearNamesCache() {
  localStorage.removeItem(NAMES_CACHE_KEY);
  localStorage.removeItem(LEGACY_SPIN_DURATION_CACHE_KEY);
}

function applySpinSettingsFromConfigData(data) {
  const durRaw = data.spinDurationSeconds ?? data.spinSpeedSeconds;
  const sec = Number(durRaw);
  if (Number.isFinite(sec) && sec > 0) {
    spinDurationMs = Math.round(sec * 1000);
  }
  const turnsRaw = data.spinSpeed;
  if (turnsRaw !== undefined && turnsRaw !== null && turnsRaw !== "") {
    const turns = Number(turnsRaw);
    if (Number.isFinite(turns) && turns > 0) {
      spinMinFullTurns = Math.min(50, Math.max(0.5, turns));
    }
  } else {
    spinMinFullTurns = 5;
  }
}

async function fetchWheelConfig() {
  for (const path of ["/config/wheel.json", "config/wheel.json", "wheel.json"]) {
    try {
      const res = await fetch(path, { cache: "no-store" });
      if (res.ok) return await res.json();
    } catch {
      /* file:// or missing */
    }
  }
  if (typeof globalThis.__WHEEL_DEFAULT__ !== "undefined") {
    return JSON.parse(JSON.stringify(globalThis.__WHEEL_DEFAULT__));
  }
  throw new Error("Wheel config unavailable");
}

async function loadSpinSettingsFromConfig() {
  try {
    const data = await fetchWheelConfig();
    applySpinSettingsFromConfigData(data);
  } catch {
    /* ignore */
  }
}

function setNamesTextarea(list) {
  namesInput.value = list.join("\n");
}

function getWinnerIndexAtRotation(R, n) {
  if (n <= 0) return -1;
  const T = Math.PI * 2;
  const slice = T / n;
  const alpha = ((-Math.PI / 2 - R) % T + T) % T;
  const shifted = (alpha + Math.PI / 2) % T;
  return Math.min(n - 1, Math.floor(shifted / slice));
}

function computeTargetRotation(currentR, winIdx, n, minExtraTurns = 5) {
  const T = Math.PI * 2;
  const slice = T / n;
  const alphaMid = winIdx * slice + slice / 2 - Math.PI / 2;
  let R = -Math.PI / 2 - alphaMid;
  const minR = currentR + minExtraTurns * T;
  while (R < minR) R += T;
  return R;
}

function drawWheel() {
  const dpr = window.devicePixelRatio || 1;
  const display = Math.max(1, canvas.clientWidth || 720);
  canvas.width = Math.round(display * dpr);
  canvas.height = Math.round(display * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const w = display;
  const h = display;
  const cx = w / 2;
  const cy = h / 2;
  const r = Math.min(w, h) / 2 - 6;

  ctx.clearRect(0, 0, w, h);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotationRad);

  const n = names.length;
  if (n === 0) {
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = "#252a35";
    ctx.fill();
    ctx.strokeStyle = "#3a4458";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.rotate(-rotationRad);
    ctx.fillStyle = "#8b95a8";
    ctx.font = `${Math.max(14, r * 0.08)}px system-ui, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("No names", 0, 0);
    ctx.restore();
    return;
  }

  const slice = (Math.PI * 2) / n;
  const colorIdx = wheelColorIndicesNoAdjacentSame(n);
  for (let i = 0; i < n; i++) {
    const a0 = i * slice - Math.PI / 2;
    const a1 = a0 + slice;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, a0, a1);
    ctx.closePath();
    const ci = colorIdx[i];
    const fill = WHEEL_COLOR_FILLS[ci];
    const textColor = WHEEL_COLOR_TEXTS[ci];
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = "rgba(15,18,24,0.22)";
    ctx.lineWidth = 1;
    ctx.stroke();

    const mid = a0 + slice / 2;
    const labelR = r * 0.62;
    const tx = Math.cos(mid) * labelR;
    const ty = Math.sin(mid) * labelR;
    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(mid);
    const fontSize = Math.max(20, Math.min(44, r * (0.48 / Math.sqrt(n))));
    const maxSpan =
      2 *
      Math.min(r - labelR - 10, labelR - r * 0.12 - 6, (r * slice) / 2);
    fillVerticalRadialLabel(ctx, names[i], fontSize, maxSpan, textColor);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(0, 0, r * 0.08, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff";
  ctx.fill();
  ctx.strokeStyle = "#34A853";
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.restore();
}

/** One letter per column along local +X (radial). Uses real glyph widths + even gaps. */
function fillVerticalRadialLabel(ctx, text, fontSize, maxSpan, color) {
  const compact = String(text).replace(/\s+/g, " ").trim();
  const chars = Array.from(compact);
  if (chars.length === 0) return;

  function setFont(fs) {
    ctx.font = `600 ${fs}px system-ui, -apple-system, "Segoe UI", sans-serif`;
  }

  function measureTotalWidth(fs) {
    setFont(fs);
    const gap = fs * 0.055;
    let sum = 0;
    for (let i = 0; i < chars.length; i++) {
      const ch = chars[i];
      const w =
        ch === " "
          ? fs * 0.35
          : Math.max(ctx.measureText(ch).width, fs * 0.12);
      sum += w;
      if (i < chars.length - 1) sum += gap;
    }
    return sum;
  }

  let fs = fontSize;
  while (measureTotalWidth(fs) > maxSpan * 0.95 && fs > 9) {
    fs *= 0.92;
  }

  setFont(fs);
  ctx.fillStyle = color;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const letterGap = fs * 0.055;
  const widths = chars.map((ch) =>
    ch === " " ? fs * 0.35 : Math.max(ctx.measureText(ch).width, fs * 0.12),
  );
  const total =
    widths.reduce((a, w) => a + w, 0) +
    letterGap * Math.max(0, chars.length - 1);

  let x = -total / 2;
  for (let i = 0; i < chars.length; i++) {
    const w = widths[i];
    ctx.fillText(chars[i], x + w / 2, 0);
    x += w + (i < chars.length - 1 ? letterGap : 0);
  }
}

function syncNamesFromUI() {
  names = parseNamesFromTextarea();
  updateControls();
  drawWheel();
}

function updateControls() {
  const empty = names.length === 0;
  const uiLocked = spinning || pendingSpinResult !== null;
  namesInput.disabled = uiLocked;
  refreshBtn.disabled = uiLocked;
  saveBtn.disabled = uiLocked;
  wheelWrap.classList.toggle("wheel-wrap--can-spin", !empty && !uiLocked);
}

function applyPendingSpinRemoval() {
  const pending = pendingSpinResult;
  pendingSpinResult = null;
  if (!pending) return;
  const { winIdx, winner } = pending;
  names.splice(winIdx, 1);
  setNamesTextarea(names);
  drawWheel();
  updateControls();
}

resultDialog.addEventListener("close", () => {
  const spinAgain = resultDialog.returnValue === "spin";
  applyPendingSpinRemoval();
  if (spinAgain && names.length > 0) {
    requestAnimationFrame(() => spin());
  }
});

async function loadConfig() {
  const data = await fetchWheelConfig();
  const list = Array.isArray(data.names) ? data.names.map(String) : [];
  applySpinSettingsFromConfigData(data);
  return list;
}

async function refreshFromConfig() {
  if (spinning || pendingSpinResult) return;
  try {
    const cached = readNamesFromCache();
    const list = cached ?? (await loadConfig());
    if (!cached) await loadSpinSettingsFromConfig();
    setNamesTextarea(list);
    names = list;
    rotationRad = 0;
    updateControls();
    drawWheel();
  } catch {
    /* load failed */
  }
}

function saveNamesToCache() {
  if (spinning || pendingSpinResult) return;
  const list = parseNamesFromTextarea();
  writeNamesToCache(list);
  names = list;
  drawWheel();
  updateControls();
}

async function initFromCacheOrConfig() {
  const cached = readNamesFromCache();
  if (cached) {
    names = cached;
    setNamesTextarea(names);
    rotationRad = 0;
    await loadSpinSettingsFromConfig();
    updateControls();
    drawWheel();
    return;
  }
  await refreshFromConfig();
}

function easeOutCubic(t) {
  return 1 - (1 - t) ** 3;
}

function spin() {
  if (spinning || pendingSpinResult || names.length === 0) return;
  names = parseNamesFromTextarea();
  if (names.length === 0) {
    updateControls();
    return;
  }

  const n = names.length;
  const winIdx = Math.floor(Math.random() * n);
  const startR = rotationRad;
  const targetR = computeTargetRotation(startR, winIdx, n, spinMinFullTurns);
  const duration = spinDurationMs;
  const t0 = performance.now();
  spinning = true;

  function frame(now) {
    const t = Math.min(1, (now - t0) / duration);
    const k = easeOutCubic(t);
    rotationRad = startR + (targetR - startR) * k;
    drawWheel();
    if (t < 1) {
      requestAnimationFrame(frame);
      return;
    }
    spinning = false;
    const winner = names[winIdx];
    rotationRad = targetR;
    drawWheel();
    pendingSpinResult = { winIdx, winner };
    resultDialogName.textContent = winner;
    updateControls();
    if (typeof resultDialog.showModal === "function") {
      try {
        resultDialog.showModal();
      } catch {
        window.alert(`The wheel selected:\n\n${winner}`);
        applyPendingSpinRemoval();
      }
    } else {
      window.alert(`The wheel selected:\n\n${winner}`);
      applyPendingSpinRemoval();
    }
  }

  requestAnimationFrame(frame);
}

namesInput.addEventListener("input", () => {
  if (spinning) return;
  syncNamesFromUI();
});

refreshBtn.addEventListener("click", refreshFromConfig);
saveBtn.addEventListener("click", saveNamesToCache);

wheelWrap.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();
  const r = rect.width / 2;
  const cx = rect.left + r;
  const cy = rect.top + r;
  const dx = e.clientX - cx;
  const dy = e.clientY - cy;
  if (dx * dx + dy * dy > r * r) return;
  spin();
});

window.addEventListener("resize", () => {
  if (!spinning) drawWheel();
});

function openConfigDialog() {
  spinDurationInput.value = (spinDurationMs / 1000).toString();
  configDialog.showModal();
}

function saveSpinDuration() {
  const value = parseFloat(spinDurationInput.value);
  if (!Number.isFinite(value) || value < 1 || value > 10) {
    alert("Please enter a value between 1 and 10 seconds");
    return;
  }
  spinDurationMs = value * 1000;
  localStorage.setItem("wheel.spinDurationMs.v1", spinDurationMs.toString());
  configDialog.close();
}

function loadSpinDurationFromStorage() {
  const stored = localStorage.getItem("wheel.spinDurationMs.v1");
  if (stored) {
    const value = parseFloat(stored);
    if (Number.isFinite(value) && value > 0) {
      spinDurationMs = value;
    }
  }
}

configureBtn.addEventListener("click", openConfigDialog);
configCancelBtn.addEventListener("click", () => configDialog.close());
configSaveBtn.addEventListener("click", saveSpinDuration);
spinDurationInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    saveSpinDuration();
  } else if (e.key === "Escape") {
    configDialog.close();
  }
});

/** @typedef {{ id: string, title: string, url: string }} LinkEntry */
/** @type {LinkEntry[]} */
let links = [];

/** @returns {LinkEntry[]} */
function readLinksFromCache() {
  try {
    const raw = localStorage.getItem(LINKS_CACHE_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(parsed)) return [];
    return parsed.filter(
      (l) => l && typeof l.id === "string" && typeof l.title === "string" && typeof l.url === "string"
    );
  } catch {
    return [];
  }
}

function writeLinksToCache(list) {
  localStorage.setItem(LINKS_CACHE_KEY, JSON.stringify(list));
}

/** Adds https:// if the entry has no scheme. */
function normalizeLinkUrl(url) {
  return /^[a-zA-Z][a-zA-Z\d+\-.]*:\/\//.test(url) ? url : `https://${url}`;
}

function renderLinks() {
  linksList.innerHTML = "";
  if (links.length === 0) {
    const empty = document.createElement("li");
    empty.className = "links-empty";
    empty.textContent = "No links yet";
    linksList.appendChild(empty);
    return;
  }
  for (const link of links) {
    const li = document.createElement("li");
    li.className = "link-item";
    li.dataset.id = link.id;

    const a = document.createElement("a");
    a.className = "link-item__link";
    a.href = link.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = link.title;
    a.title = link.url;

    const actions = document.createElement("div");
    actions.className = "link-item__actions";

    const editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.className = "link-item__icon-btn";
    editBtn.title = "Edit";
    editBtn.textContent = "✏️";
    editBtn.addEventListener("click", () => startEditLink(link.id));

    const removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "link-item__icon-btn";
    removeBtn.title = "Remove";
    removeBtn.textContent = "🗑️";
    removeBtn.addEventListener("click", () => removeLink(link.id));

    actions.append(editBtn, removeBtn);
    li.append(a, actions);
    linksList.appendChild(li);
  }
}

function startEditLink(id) {
  const link = links.find((l) => l.id === id);
  const li = linksList.querySelector(`[data-id="${id}"]`);
  if (!link || !li) return;
  li.innerHTML = "";
  li.classList.add("link-item--editing");

  const titleInput = document.createElement("input");
  titleInput.type = "text";
  titleInput.className = "link-item__input";
  titleInput.value = link.title;

  const urlInput = document.createElement("input");
  urlInput.type = "text";
  urlInput.className = "link-item__input";
  urlInput.value = link.url;

  const actions = document.createElement("div");
  actions.className = "link-item__actions";

  const saveEditBtn = document.createElement("button");
  saveEditBtn.type = "button";
  saveEditBtn.className = "link-item__icon-btn";
  saveEditBtn.title = "Save";
  saveEditBtn.textContent = "✅";
  saveEditBtn.addEventListener("click", () => {
    const newTitle = titleInput.value.trim();
    const newUrl = urlInput.value.trim();
    if (!newTitle || !newUrl) return;
    link.title = newTitle;
    link.url = normalizeLinkUrl(newUrl);
    writeLinksToCache(links);
    renderLinks();
  });

  const cancelEditBtn = document.createElement("button");
  cancelEditBtn.type = "button";
  cancelEditBtn.className = "link-item__icon-btn";
  cancelEditBtn.title = "Cancel";
  cancelEditBtn.textContent = "✖️";
  cancelEditBtn.addEventListener("click", () => renderLinks());

  actions.append(saveEditBtn, cancelEditBtn);
  li.append(titleInput, urlInput, actions);
}

function removeLink(id) {
  links = links.filter((l) => l.id !== id);
  writeLinksToCache(links);
  renderLinks();
}

function initLinksPanel() {
  links = readLinksFromCache();
  renderLinks();

  linksToggleBtn.addEventListener("click", () => {
    const expanded = linksPanel.classList.toggle("links-panel--expanded");
    linksToggleBtn.setAttribute("aria-expanded", expanded ? "true" : "false");
  });

  linksAddForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const title = linkTitleInput.value.trim();
    const url = linkUrlInput.value.trim();
    if (!title || !url) return;
    const id = typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : String(Date.now());
    links.push({ id, title, url: normalizeLinkUrl(url) });
    writeLinksToCache(links);
    renderLinks();
    linksAddForm.reset();
    linkTitleInput.focus();
  });
}

loadSpinDurationFromStorage();
initFromCacheOrConfig();
initLinksPanel();

</script>
